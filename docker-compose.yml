services:
  nebula:
    build:
      context: .
      dockerfile: Dockerfile
    image: nebula-drive:latest
    container_name: nebula-drive
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATA_DIR: /data
      STORAGE_ROOT: /storage
      APP_NAME: NebulaDrive 星云网盘
      # 公网地址，用于生成分享链接（按实际域名修改）
      APP_URL: http://localhost:8080
      # 可选：固定 JWT 密钥（不设置则首次启动自动生成并持久化到 /data/.jwt-secret）
      # JWT_SECRET: my-super-secret-key
    volumes:
      # 数据库 / 上传会话 / 回收站 / JWT 密钥
      - nebula-data:/data
      # 网盘存储根目录（本地存储的文件落盘处）
      - nebula-storage:/storage
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nebula-data:
  nebula-storage:
